# Taplo TOML formatter/linter configuration
# https://taplo.tamasfe.dev/configuration/file.html
#
# Note on structure: `rule` is an ARRAY of tables (`[[rule]]`), and the `schema`
# inside a rule is a single TABLE (`[rule.schema]`), not an array. Global file
# selection lives at the top level, not inside a rule.

# Global file selection
include = ["**/*.toml"]
exclude = ["vendor/**", "node_modules/**"]

[formatting]
# Use 2-space indentation
indent_string = "  "
# Align consecutive entries
align_entries = false
# Reorder keys alphabetically within sections
reorder_keys = false
# Max line width
column_width = 100

# Associate cloudcoop.toml (at the root or nested) with our local schema
[[rule]]
include = ["cloudcoop.toml", "**/cloudcoop.toml"]

[rule.schema]
path = "schemas/cloudcoop.schema.json"
