# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration for cloudcoop
# Documentation: https://goreleaser.com
---
version: 2

project_name: cloudcoop

# Build configuration
builds:
  - id: cloudcoop
    main: ./cmd/cloudcoop
    binary: cloudcoop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Skip windows/arm64 (limited support)
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.ShortCommit}}
      - -X main.BuildTime={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

# Archive configuration
archives:
  - id: default
    format: tar.gz
    # Use zip for windows
    format_overrides:
      - goos: windows
        format: zip
    # Naming convention: cloudcoop_OS_ARCH
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}
    # Include these files in the archive
    files:
      - README.md
      - LICENSE*
      - CHANGELOG*

# Checksum configuration
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Snapshot configuration (for non-tagged builds)
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Changelog configuration
changelog:
  sort: asc
  use: github
  filters:
    # Exclude certain commit types from changelog
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^refactor:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance Improvements
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Breaking Changes
      regexp: '^.*?!:.+$'
      order: 3
    - title: Other Changes
      order: 999

# GitHub Release configuration
release:
  github:
    owner: cloud-coop
    name: cloudcoop
  # Draft release for review before publishing
  draft: true
  # Include pre-releases
  prerelease: auto
  # Release name template
  name_template: "v{{.Version}}"
  # Release header template
  header: |
    ## cloudcoop v{{.Version}}

    Released on {{ .Date }}
  # Release footer template
  footer: |
    ---

    **Full Changelog**: https://github.com/cloud-coop/cloudcoop/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### Installation

    Download the appropriate binary for your platform from the assets below.

    #### macOS (Apple Silicon)
    ```bash
    curl -LO https://github.com/cloud-coop/cloudcoop/releases/download/{{ .Tag }}/cloudcoop_darwin_arm64.tar.gz
    tar -xzf cloudcoop_darwin_arm64.tar.gz
    chmod +x cloudcoop
    sudo mv cloudcoop /usr/local/bin/
    ```

    #### macOS (Intel)
    ```bash
    curl -LO https://github.com/cloud-coop/cloudcoop/releases/download/{{ .Tag }}/cloudcoop_darwin_amd64.tar.gz
    tar -xzf cloudcoop_darwin_amd64.tar.gz
    chmod +x cloudcoop
    sudo mv cloudcoop /usr/local/bin/
    ```

    #### Linux (x86_64)
    ```bash
    curl -LO https://github.com/cloud-coop/cloudcoop/releases/download/{{ .Tag }}/cloudcoop_linux_amd64.tar.gz
    tar -xzf cloudcoop_linux_amd64.tar.gz
    chmod +x cloudcoop
    sudo mv cloudcoop /usr/local/bin/
    ```

    #### Windows
    Download `cloudcoop_windows_amd64.zip` and extract the executable.

# Announce configuration (optional - can be enabled later)
# announce:
#   skip: true

# Metadata configuration
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

# Before hooks (run before the build)
before:
  hooks:
    - go mod tidy
    - go mod download

# Universal binaries for macOS (combines amd64 and arm64)
universal_binaries:
  - id: cloudcoop-universal
    replace: false
    name_template: "cloudcoop"
    # Keep individual binaries as well
    hooks: {}
