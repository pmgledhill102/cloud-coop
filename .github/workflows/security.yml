name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: '1.25'

jobs:
  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run gosec
        uses: securego/gosec@master
        with:
          # Exclude rules that are known/accepted:
          # G106: SSH InsecureIgnoreHostKey (tracked in cc-xzi)
          # G204: Subprocess with variable (expected for SSH tool)
          # G304: File path traversal (test utilities use dynamic paths)
          args: -exclude=G106,G204,G304 -exclude-generated -severity medium -confidence medium -quiet ./...

  # Gatekeeper job for branch protection
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: [govulncheck, gosec]
    if: always()
    steps:
      - name: Check security scan results
        run: |
          if [ "${{ needs.govulncheck.result }}" != "success" ]; then
            echo "govulncheck failed"
            exit 1
          fi
          if [ "${{ needs.gosec.result }}" != "success" ]; then
            echo "gosec failed"
            exit 1
          fi
          echo "All security checks passed"
