name: Integration Tests

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: read
  id-token: write # Required for Workload Identity Federation

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: cc-integration-test@${{ vars.GCP_INTEGRATION_PROJECT }}.iam.gserviceaccount.com

      - name: Run integration tests
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_INTEGRATION_PROJECT }}
          GOOGLE_CLOUD_ZONE: europe-north2-a
          GOOGLE_CLOUD_NETWORK: inttest
          GOOGLE_CLOUD_SUBNET: inttest-europe-north2
        run: go test -v -tags=integration -timeout 30m ./integration/...

      - name: Cleanup orphaned VMs
        if: always()
        run: |
          gcloud compute instances list \
            --project="${{ vars.GCP_INTEGRATION_PROJECT }}" \
            --filter="name~cc-inttest-" \
            --format="value(name,zone)" 2>/dev/null | \
          while read -r name zone; do
            echo "Cleaning up orphaned VM: $name in $zone"
            gcloud compute instances delete "$name" --zone="$zone" --quiet --project="${{ vars.GCP_INTEGRATION_PROJECT }}" || true
          done
