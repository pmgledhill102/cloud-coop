# Dependabot Auto-merge Workflow
# Automatically merges Dependabot PRs for non-major version updates
# after all required checks pass.

name: Dependabot Auto-merge

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for non-major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log decision
        run: |
          echo "PR: ${{ github.event.pull_request.html_url }}"
          echo "Dependency: ${{ steps.metadata.outputs.dependency-names }}"
          echo "Update type: ${{ steps.metadata.outputs.update-type }}"
          if [ "${{ steps.metadata.outputs.update-type }}" = "version-update:semver-major" ]; then
            echo "Decision: SKIPPED (major version update requires manual review)"
          else
            echo "Decision: AUTO-MERGE ENABLED"
          fi
