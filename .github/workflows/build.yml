name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.25.12'

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/cloudcoop-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/cloudcoop

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cloudcoop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cloudcoop-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 7

  verify:
    name: Verify artifacts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Built artifacts:"
          find artifacts -type f -exec ls -lh {} \;

      - name: Verify Linux amd64 binary
        run: |
          chmod +x artifacts/cloudcoop-linux-amd64/cloudcoop-linux-amd64
          file artifacts/cloudcoop-linux-amd64/cloudcoop-linux-amd64
